name: knowledgebase-storage

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  kbstore-api:
    image: "ghcr.io/mu-software/knowledgebase_storage:${KBSTORE_IMAGE_TAG:?Set KBSTORE_IMAGE_TAG}"
    command: ["python", "-m", "backend"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    ports:
      - "${KBSTORE_BIND_ADDRESS:?Set KBSTORE_BIND_ADDRESS}:8006:8006"
    environment:
      TZ: Asia/Seoul
      DATABASE__DSN: ${KBSTORE_POSTGRES_DSN:?Set KBSTORE_POSTGRES_DSN}
      NOTES_DIR: /srv/knowledgebase/notes
    volumes:
      - knowledgebase-notes:/srv/knowledgebase/notes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  kbstore-worker:
    image: "ghcr.io/mu-software/knowledgebase_storage:${KBSTORE_IMAGE_TAG:?Set KBSTORE_IMAGE_TAG}"
    command: ["python", "-m", "backend.cli", "worker", "--api-url", "http://kbstore-api:8006"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      TZ: Asia/Seoul
    depends_on:
      kbstore-api:
        condition: service_healthy

  basic-memory:
    image: "ghcr.io/mu-software/basic-memory:${BASIC_MEMORY_IMAGE_TAG:-latest}"
    command:
      ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8005", "--path", "/mcp"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    expose: ["8005"]
    environment:
      TZ: Asia/Seoul
      BASIC_MEMORY_CONFIG_DIR: /srv/knowledgebase/config
    volumes:
      - knowledgebase-notes:/srv/knowledgebase/notes
      - knowledgebase-config:/srv/knowledgebase/config

volumes:
  knowledgebase-notes:
    driver: local
    driver_opts: { type: none, o: bind, device: /srv/data/knowledgebase/notes }
  knowledgebase-config:
    driver: local
    driver_opts: { type: none, o: bind, device: /srv/data/knowledgebase/config }
