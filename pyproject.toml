[project]
name = "knowledgebase-storage"
version = "0.1.0"
description = "Collects, summarizes and publishes project knowledge from many devices and LLM services."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic[tz]>=1.19.2",
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.12.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]

[tool.alembic]
script_location = "%(here)s/backend/alembic"
prepend_sys_path = ["%(here)s/"]
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s"
timezone = "Asia/Seoul"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "backend.models"
disable_error_code = ["call-overload"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "C", "COM", "DTZ", "E", "EM", "ERA",
    "F", "FA", "FAST", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG",
    "N", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET", "RSE",
    "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC", "TD", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "PLC0415",
    "B008",
    "COM812",
    "UP046",
    "UP047",
    "TRY003",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlmodel.SQLModel",
    "backend.repositories.RepositoryImpl",
    "backend.services.ServiceImpl",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/*" = ["ANN401", "ARG001", "E402", "INP001", "TC001", "TC002", "TC003"]
"backend/models.py" = ["ANN401"]
"tools/*" = ["S310", "SIM115", "T201", "TC003"]
"backend/routes/*" = ["TC001", "TC002", "TC003"]
"backend/dependencies/*" = ["TC001", "TC002", "TC003"]
